# Extra wake words on top of the stock Hey Jarvis / Okay Nabu, plus one switch
# per wake word so the active set changes from Home Assistant without a reflash.
#
# ESPHome packages merge lists by concatenation — the model rows append to the
# stock models and the on_client_connected steps run after the stock ones
# (micro_wake_word.start included). satellite1.yaml itself relies on the same
# mechanism for its va_connected_wait_for_ble_and_flasher package.
#
# Wake-word choice is mostly acoustics: more syllables and harder consonants
# survive distance. Measured on this device, "Hey Jarvis" scores 0.88-0.90 from
# across the room while the single word "computer" managed 0.83 at the same
# distance and 0.98 only at arm's length — which is why "hey robot" is the
# default here and "computer" is kept switchable but off.

micro_wake_word:
  models:
    - model: common/wake_words/hey_robot.json
      id: hey_robot
    - model: common/wake_words/computer.json
      id: computer
  # gain_factor is deliberately left at the stock 6. Raising it to 10 to chase
  # range made detection strictly worse (zero detections), consistent with the
  # louder signal clipping and distorting the features the model was trained on.

select:
  - platform: template
    id: !extend mww_sensitivity_select
    on_value:
      # !extend REPLACES the stock on_value automation (it is not a list), so
      # this lambda must carry the stock okay_nabu/hey_jarvis cutoffs verbatim
      # (from common/voice_assistant.yaml) plus the added models'.
      # Cutoffs are quantized uint8 (value/255).
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 (stock)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 (stock)
          id(hey_robot).set_probability_cutoff(247);    // 0.97 (model default)
          id(computer).set_probability_cutoff(242);     // 0.95 (model default)
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 (stock)
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 (stock)
          id(hey_robot).set_probability_cutoff(230);    // 0.90
          id(computer).set_probability_cutoff(230);     // 0.90
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 (stock)
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 (stock)
          // "hey robot" is four syllables and vanishingly rare in ordinary
          // speech, so it tolerates a lower bar than a common single word.
          id(hey_robot).set_probability_cutoff(196);    // 0.77
          id(computer).set_probability_cutoff(209);     // 0.82
        }

switch:
  - platform: template
    id: wake_word_hey_robot
    name: "Wake word: Hey Robot"
    icon: "mdi:robot"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - micro_wake_word.enable_model: hey_robot
    turn_off_action:
      - micro_wake_word.disable_model: hey_robot

  - platform: template
    id: wake_word_computer
    name: "Wake word: Computer"
    icon: "mdi:account-voice"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.enable_model: computer
    turn_off_action:
      - micro_wake_word.disable_model: computer

  - platform: template
    id: wake_word_hey_jarvis
    name: "Wake word: Hey Jarvis"
    icon: "mdi:account-voice"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - micro_wake_word.enable_model: hey_jarvis
    turn_off_action:
      - micro_wake_word.disable_model: hey_jarvis

  - platform: template
    id: wake_word_okay_nabu
    name: "Wake word: Okay Nabu"
    icon: "mdi:account-voice"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - micro_wake_word.enable_model: okay_nabu
    turn_off_action:
      - micro_wake_word.disable_model: okay_nabu

voice_assistant:
  on_client_connected:
    # Reconcile model enable state with the switches every time the voice
    # subscriber (the bridge) connects, regardless of boot restore ordering.
    - if:
        condition:
          switch.is_on: wake_word_hey_robot
        then:
          - micro_wake_word.enable_model: hey_robot
        else:
          - micro_wake_word.disable_model: hey_robot
    - if:
        condition:
          switch.is_on: wake_word_computer
        then:
          - micro_wake_word.enable_model: computer
        else:
          - micro_wake_word.disable_model: computer
    - if:
        condition:
          switch.is_on: wake_word_hey_jarvis
        then:
          - micro_wake_word.enable_model: hey_jarvis
        else:
          - micro_wake_word.disable_model: hey_jarvis
    - if:
        condition:
          switch.is_on: wake_word_okay_nabu
        then:
          - micro_wake_word.enable_model: okay_nabu
        else:
          - micro_wake_word.disable_model: okay_nabu
