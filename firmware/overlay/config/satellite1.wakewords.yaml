# Satellite1 stock v0.2.0 plus extra wake words ("hey robot", "computer").
# Same construction as the stock ld2410/ld2450 variants: the stock
# satellite1.yaml is included as a package and extended, never edited.
# esp32_fw_version pins the reported project version to the stock release so
# the Home Assistant update entity stays quiet (installing a stock update from
# it would drop the added wake words until this overlay is rebuilt).
substitutions:
  esp32_fw_version: v0.2.0

packages:
  base_image: !include satellite1.yaml
  extra_wake_words: !include common/extra_wake_words.yaml
