# Copy to voicebridge.yaml and adjust. The real voicebridge.yaml is gitignored
# because it describes your house (area aliases, opt-ins, satellite placement).

session:
  # warm: keep a configured session open so audio can start streaming
  #   immediately (recycled automatically before the 60-minute session cap).
  #   Required for follow-ups to be worth having — otherwise the second
  #   utterance pays a fresh connection setup.
  # per_utterance: open a Realtime session when a command starts (simple, pays
  #   connection setup on every command).
  mode: warm
  # The full model, not the mini: it follows the tool contract more reliably and
  # reads tone from the audio, which is what the mood composer runs on.
  model: gpt-realtime-2.1
  # Ask OpenAI to also transcribe input audio (logged for debugging; small cost).
  transcribe_input: true
  # Optional logged acknowledgement after execution. Keep false for a
  # speakerless satellite so a second model response cannot delay the next wake.
  ack_response: false

policy:
  # When true, commands resolve and log but nothing is sent to Home Assistant.
  dry_run: false
  tiers:
    green: [light, fan, switch, media_player, scene, script]
    yellow: [lock, cover, climate]
    red: [alarm_control_panel]
  # YELLOW-tier entities that may be controlled, listed explicitly.
  # Everything not listed is refused. Example: [lock.front_door]
  yellow_allow: []
  matching:
    # Refuse when the best name match scores below this (0..1).
    min_confidence: 0.6
    # Refuse collective commands ("all lights") that would touch more targets.
    max_collective_targets: 10
  # Spoken area phrases → Home Assistant area names.
  # Example:
  #   "down here": [Living Room, Kitchen]
  #   "downstairs": [Living Room, Kitchen]
  area_aliases: {}

# Keep listening after a command so a follow-up needs no second wake word.
# This holds the satellite microphone open and streaming for the window, so it
# is opt-out rather than implicit: set follow_up_seconds: 0 to disable.
# The window closes early when the model judges what it heard to be ordinary
# conversation, and max_follow_ups caps a chain so a loud room cannot hold the
# microphone open indefinitely.
conversation:
  follow_up_seconds: 6
  max_follow_ups: 3

# The stronger model the fast one hands off to. Reached only when the fast model
# calls `delegate` (it is unsure, or the request needs real coordination), or
# when policy refused a command that looked like a near miss — never on the
# common path. Expect roughly 2-3 s when it is used, against ~0.5 s without.
# Whatever it proposes goes through the same policy engine, so delegating buys a
# better plan and never wider authority.
delegate:
  enabled: true
  model: gpt-6-luna
  # none | low | medium | high | xhigh | max. Anything above "none" adds seconds.
  reasoning_effort: none
  timeout_seconds: 8

# Satellite1 ESPHome native-API connections. Home Assistant's config-entry ID
# lets the bridge fetch the Noise encryption key at runtime without copying the
# key into YAML. Area is optional until the satellite has a permanent room.
satellites: {}
# satellites:
#   satellite1-aabbcc:
#     host: 192.168.20.135
#     port: 6053
#     ha_entry_id: 01EXAMPLECONFIGENTRYID
#     area: Kitchen
# For a custom ESPHome build not managed by HA, point at an environment
# variable instead: encryption_key_env: SATELLITE1_ENCRYPTION_KEY

# Phrase-triggered light flourishes: a fixed short-lived look, then the lights
# go back exactly as they were. Matched locally against the transcript, so the
# model is never consulted — it cannot refuse, moralize, or reinterpret these.
# Targeting still goes through the policy engine: a flourish only ever touches
# lights in the stated area (or the satellite's own room), capability-checked.
# Everything else stays model-interpreted; this is not a general mood table.
flourishes: []
# flourishes:
#   # Hold one look: an advertised effect, an RGB colour, or a colour temperature.
#   - phrases: ["candlelight"]
#     effect: candle           # must be advertised by the area's lights
#     brightness_pct: 40
#     duration_seconds: 12
#
#   # Or walk a palette around the room: each light takes the next colour and the
#   # assignment steps along every interval, so the rainbow visibly travels.
#   # Short interval + zero transition reads as flashy; longer + a transition is
#   # a gentle wash. A bulb's own effect (e.g. "prism") is much subtler than this.
#   - phrases: ["disco time", "party mode"]
#     rotate_rgb: [[255, 0, 0], [255, 240, 0], [0, 255, 60], [0, 140, 255], [190, 0, 255]]
#     rotate_interval_seconds: 0.45
#     rotate_transition_seconds: 0
#     brightness_pct: 100
#     duration_seconds: 5

# Override the built-in lighting recipes. The model chooses a mood and an area;
# the bridge decides which bulb does what, using each light's live capabilities.
# Lights are classified key (ceilings, mains), accent (colour-capable character
# lighting) or utility (closets, cabinets) from their names and capabilities.
# Anything you leave out keeps the built-in value.
moods: {}
# moods:
#   intimate:
#     key: { off: true }
#     accent: { rgb: [255, 60, 30], brightness_pct: 10 }
#   focus:
#     key: { kelvin: 5000, brightness_pct: 100 }

telemetry:
  jsonl_path: var/commands.jsonl
